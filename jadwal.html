<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Operasional</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #20232a;
        }

        .container {
            width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 30px 38px;
            background:
                linear-gradient(135deg,
                rgba(255,255,255,.8) 25%,
                rgba(220,220,220,.8) 25%,
                rgba(220,220,220,.8) 50%,
                rgba(245,245,245,.8) 50%,
                rgba(245,245,245,.8) 75%,
                rgba(215,215,215,.8) 75%);
            background-size: 180px 180px;
        }

        .logo {
            text-align: center;
            font-size: 150px;
            line-height: 1;
            margin-bottom: 20px;
        }

        .menu {
            text-align: center;
            font-size: 20px;
            margin-bottom: 45px;
        }

        .menu a {
            color: #3b168d;
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #777;
            margin-bottom: 45px;
        }

        h1 {
            font-size: 36px;
            font-weight: normal;
            margin-bottom: 45px;
        }

        table {
            border-collapse: collapse;
            width: 310px;
            background: rgba(255,255,255,.65);
            font-size: 20px;
        }

        th, td {
            border: 2px solid #444;
            padding: 18px 15px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-weight: normal;
        }

        .catatan {
            font-style: italic;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 17px;
            margin-top: 65px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        ☕
    </div>

    <div class="menu">
        <a href="#">Beranda</a>
        |
        <a href="#">Jadwal Operasional</a>
    </div>

    <hr>

    <h1>Jam Operasional Kedai</h1>

    <table>
        <tr>
            <th>Hari</th>
            <th>Jam<br>Buka</th>
        </tr>

        <tr>
            <td>Senin -<br>Jumat</td>
            <td>09.00 -<br>22.00</td>
        </tr>

        <tr>
            <td>Sabtu -<br>Minggu</td>
            <td>10.00 -<br>24.00</td>
        </tr>

        <tr>
            <td colspan="2" class="catatan">
                Format waktu dalam WIB
            </td>
        </tr>
    </table>

    <footer>
        Created by Dede Iyan Supardi @2026
    </footer>

</div>

</body>
</html>
